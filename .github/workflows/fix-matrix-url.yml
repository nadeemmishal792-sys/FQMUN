name: Fix Matrix URL Connector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix admin matrix URL parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          old = "function matrixValue(source,key){if(!source)return'';const variants=[key,key.toLowerCase(),key+'Url',key.toLowerCase()+'Url',key+'URL',key.toLowerCase()+'URL'];for(const k of variants){if(typeof source[k]==='string'&&source[k].trim())return source[k].trim()}return''}"

          new = "function matrixValue(source,key){if(!source)return'';const variants=[key,key.toLowerCase(),key+'Url',key.toLowerCase()+'Url',key+'URL',key.toLowerCase()+'URL'];for(const k of variants){if(typeof source[k]==='string'&&source[k].trim())return source[k].trim();if(source[k]&&typeof source[k]==='object'){const nested=['url','URL','href','link','spreadsheetUrl','spreadsheetURL'];for(const n of nested){if(typeof source[k][n]==='string'&&source[k][n].trim())return source[k][n].trim()}}}return''}"

          if old not in s:
              raise SystemExit('Expected matrixValue function was not found; no file changes made.')

          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git rm .github/workflows/fix-matrix-url.yml
          git commit -m 'Fix committee matrix URL parsing'
          git push origin main
